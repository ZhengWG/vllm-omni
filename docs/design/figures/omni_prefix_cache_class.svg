<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780">
  <style>
    text{font-family:ui-monospace,'SF Mono',Consolas,Menlo,monospace;fill:#1B2530;}
    .t-title{font-size:14px;font-weight:600;}
    .t-stereo{font-size:10.5px;fill:#5D6B79;}
    .t-label{font-size:12px;}
    .t-small{font-size:10.8px;fill:#5D6B79;}
    .t-arrow{font-size:10.8px;fill:#5D6B79;}
    .t-arrow.hot{fill:#B4671F;}
    .t-arrow.cold{fill:#3E6E96;}
    .box{fill:#FBFCFD;stroke:#CFD7DE;stroke-width:1.25;}
    .box-hot{fill:#FBFCFD;stroke:#B4671F;stroke-width:1.4;}
    .hdr{fill:#EDF0F2;stroke:#CFD7DE;stroke-width:1;}
    .divider{stroke:#CFD7DE;stroke-width:1;}
    .flow-hot{stroke:#B4671F;stroke-width:1.8;fill:none;}
    .flow-cold{stroke:#3E6E96;stroke-width:1.5;stroke-dasharray:6 4;fill:none;}
    .flow-grey{stroke:#5D6B79;stroke-width:1.2;stroke-dasharray:4 4;fill:none;}
    .flow-solid{stroke:#5D6B79;stroke-width:1.3;fill:none;}
  </style>
  <defs>
    <marker id="dep" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8" fill="none" stroke="#5D6B79" stroke-width="1.4"/></marker>
    <marker id="dephot" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8" fill="none" stroke="#B4671F" stroke-width="1.4"/></marker>
    <marker id="depcold" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8" fill="none" stroke="#3E6E96" stroke-width="1.4"/></marker>
    <marker id="tri" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#FBFCFD" stroke="#5D6B79" stroke-width="1.2"/></marker>
    <marker id="dia" viewBox="0 0 14 8" refX="1" refY="4" markerWidth="14" markerHeight="8" orient="auto"><path d="M1 4 L7 0 L13 4 L7 8 Z" fill="#1B2530"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="780" fill="#F2F4F6"/>

  <!-- policy -->
  <rect class="box" x="36" y="24" width="300" height="128" rx="6"/>
  <rect class="hdr" x="36" y="24" width="300" height="40" rx="6"/>
  <text class="t-stereo" x="186" y="40" text-anchor="middle">&#171;dataclass &#183; load_model once&#187;</text>
  <text class="t-title" x="186" y="57" text-anchor="middle">ModelCachePolicy</text>
  <text class="t-label" x="52" y="86">needs_full_hidden_states</text>
  <text class="t-label" x="52" y="104">merge_consumed_by_postprocess</text>
  <text class="t-label" x="52" y="122">deferred_keys / skip_keys</text>
  <text class="t-small" x="52" y="140">skip_keys never enter the state machine</text>

  <!-- config -->
  <rect class="box" x="36" y="170" width="300" height="96" rx="6"/>
  <rect class="hdr" x="36" y="170" width="300" height="40" rx="6"/>
  <text class="t-stereo" x="186" y="186" text-anchor="middle">&#171;dataclass &#183; mirrors KVCacheConfig&#187;</text>
  <text class="t-title" x="186" y="203" text-anchor="middle">PrefixCacheConfig</text>
  <text class="t-label" x="52" y="232">num_blocks &#183; block_size &#183; gpu_staging_bytes</text>
  <text class="t-label" x="52" y="250">staging_depth / capacity &#183; copy_chunk_bytes</text>

  <!-- outputs -->
  <rect class="box" x="36" y="284" width="300" height="92" rx="6"/>
  <rect class="hdr" x="36" y="284" width="300" height="40" rx="6"/>
  <text class="t-stereo" x="186" y="300" text-anchor="middle">&#171;NamedTuple &#183; materialize return&#187;</text>
  <text class="t-title" x="186" y="317" text-anchor="middle">StageCacheOutputs</text>
  <text class="t-label" x="52" y="346">hidden_states: {req &#8594; Tensor} | None</text>
  <text class="t-label" x="52" y="364">mm_outputs: {key &#8594; {req &#8594; payload}}</text>

  <!-- task -->
  <rect class="box" x="36" y="394" width="300" height="168" rx="6"/>
  <rect class="hdr" x="36" y="394" width="300" height="40" rx="6"/>
  <text class="t-stereo" x="186" y="410" text-anchor="middle">&#171;one write job &#183; owner = entry_id&#187;</text>
  <text class="t-title" x="186" y="427" text-anchor="middle">EntryWriteTask</text>
  <text class="t-label" x="52" y="456">entry_id &#8805; 1 &#183; JOIN_NEXT_STEP | JOIN_ON_FINISH</text>
  <text class="t-label" x="52" y="474">segments: list[_Segment]</text>
  <text class="t-label" x="52" y="492">freeze_event &#183; deps &#183; skip mask</text>
  <text class="t-label" x="52" y="510">d2h_claimed &#183; host_ready / done</text>
  <text class="t-small" x="52" y="534">_Segment = slots + frozen tensors + host</text>
  <text class="t-small" x="52" y="550">not a cache row; not identified by (slot, key)</text>

  <!-- manager -->
  <rect class="box-hot" x="380" y="24" width="420" height="292" rx="6"/>
  <rect class="hdr" x="380" y="24" width="420" height="40" rx="6"/>
  <text class="t-stereo" x="590" y="40" text-anchor="middle">&#171;facade &#183; slot / entry authority &#183; mirrors KVCacheManager&#187;</text>
  <text class="t-title" x="590" y="57" text-anchor="middle">OmniPrefixCacheManager</text>
  <text class="t-label" x="396" y="86">+ register_policy(policy)</text>
  <text class="t-label" x="396" y="104">+ new_step_starts(scheduler_output)</text>
  <text class="t-label" x="396" y="122">+ save_outputs(...) &#8594; step_id</text>
  <text class="t-label" x="396" y="140">+ materialize(sid, req_ids) &#8594; StageCacheOutputs</text>
  <text class="t-label" x="396" y="158">+ discard_step(sid) &#183; + shutdown()</text>
  <line class="divider" x1="380" y1="172" x2="800" y2="172"/>
  <text class="t-label" x="396" y="194">&#8722; (slot, key) state / owner tables</text>
  <text class="t-label" x="396" y="212">&#8722; step ctx[sid]: slots, save-time owners, hits</text>
  <text class="t-label" x="396" y="230">&#8722; drain completions &#183; merge by owner group</text>
  <text class="t-small" x="396" y="256">View used only in new_step_starts / save_outputs</text>
  <text class="t-small" x="396" y="274">lock covers tables; join / D2H / cap flush unlock</text>
  <text class="t-small" x="396" y="292">sid consumed once: materialize xor discard_step</text>
  <text class="t-small" x="396" y="308">0 owner = no in-flight entry, not absent</text>

  <!-- controller -->
  <rect class="box-hot" x="380" y="340" width="420" height="222" rx="6"/>
  <rect class="hdr" x="380" y="340" width="420" height="40" rx="6"/>
  <text class="t-stereo" x="590" y="356" text-anchor="middle">&#171;mover &#183; no req_id &#183; single mirror writer&#187;</text>
  <text class="t-title" x="590" y="373" text-anchor="middle">OmniPrefixCacheController</text>
  <text class="t-label" x="396" y="402">+ submit(task) &#183; + append_segment(task, seg)</text>
  <text class="t-label" x="396" y="420">+ join(eids) &#183; + escalate(eids)</text>
  <text class="t-label" x="396" y="438">+ drain_completed() &#8594; [eid]</text>
  <text class="t-label" x="396" y="456">+ fetch_host(task, slots, key)</text>
  <line class="divider" x1="380" y1="468" x2="800" y2="468"/>
  <text class="t-small" x="396" y="490">hi: JOIN_NEXT_STEP (wait host_event); lo: JOIN_ON_FINISH D2H</text>
  <text class="t-small" x="396" y="508">scatter after copy; honor deps only on unskipped overlap</text>
  <text class="t-small" x="396" y="526">GPU snapshot lifetime follows task ref; cap flushes oldest</text>
  <text class="t-small" x="396" y="544">eager mode: whole pipeline on submit (NPU / CPU tests)</text>

  <!-- view -->
  <rect class="box" x="844" y="24" width="360" height="148" rx="6"/>
  <rect class="hdr" x="844" y="24" width="360" height="40" rx="6"/>
  <text class="t-stereo" x="1024" y="40" text-anchor="middle">&#171;protocol &#183; sole vLLM block-table seam&#187;</text>
  <text class="t-title" x="1024" y="57" text-anchor="middle">KVCacheGroupView</text>
  <text class="t-label" x="860" y="86">block_size &#183; num_blocks</text>
  <text class="t-label" x="860" y="104">step_slots_cpu(reqs, sched) &#183; slots_for(req, s, e)</text>
  <text class="t-label" x="860" y="122">cached_block_ids(req) &#183; batch_req_ids()</text>
  <text class="t-small" x="860" y="148">never used from materialize</text>

  <!-- view impl -->
  <rect class="box" x="844" y="192" width="360" height="88" rx="6"/>
  <rect class="hdr" x="844" y="192" width="360" height="40" rx="6"/>
  <text class="t-stereo" x="1024" y="208" text-anchor="middle">&#171;impl &#183; first full-attn group&#187;</text>
  <text class="t-title" x="1024" y="225" text-anchor="middle">FullAttentionGroupView</text>
  <text class="t-small" x="860" y="254">factory None &#8594; feature self-disables</text>
  <text class="t-small" x="860" y="270">holds live InputBatch (save / new_step only)</text>

  <!-- pool -->
  <rect class="box" x="844" y="340" width="360" height="222" rx="6"/>
  <rect class="hdr" x="844" y="340" width="360" height="40" rx="6"/>
  <text class="t-stereo" x="1024" y="356" text-anchor="middle">&#171;pinned CPU mirror &#183; mirrors BlockPool&#187;</text>
  <text class="t-title" x="1024" y="373" text-anchor="middle">PrefixBlockPool</text>
  <text class="t-label" x="860" y="402">+ ensure_key(key, dtype, feat)</text>
  <text class="t-label" x="860" y="420">+ rows(key, slots)          &#171;any reader&#187;</text>
  <text class="t-label" x="860" y="438">+ scatter(key, slots, src)  &#171;controller only&#187;</text>
  <line class="divider" x1="844" y1="452" x2="1204" y2="452"/>
  <text class="t-small" x="860" y="474">shape (num_blocks, block_size, D) per key</text>
  <text class="t-small" x="860" y="492">flat slot id = block * block_size + offset</text>
  <text class="t-small" x="860" y="510">one key = one tensor stream (hidden vs codes)</text>
  <text class="t-small" x="860" y="528">committed rows live here; in-transit does not</text>
  <text class="t-small" x="860" y="546">no generation tag in this RFC</text>

  <!-- runner note -->
  <rect class="box" x="380" y="582" width="824" height="72" rx="6"/>
  <text class="t-stereo" x="396" y="604">gpu_ar_model_runner (not owned)</text>
  <text class="t-label" x="396" y="626">load_model: register_policy &#183; execute_model: new_step_starts &#8594; forward &#8594; save_outputs</text>
  <text class="t-label" x="396" y="644">sample / output build: materialize(sid, snapshot req_ids) or discard_step(sid)</text>

  <text class="t-small" x="36" y="590">vllm_omni/core/prefix_cache/</text>
  <text class="t-small" x="36" y="608">interface.py &#183; manager.py</text>
  <text class="t-small" x="36" y="626">controller.py &#183; block_pool.py</text>
  <text class="t-small" x="36" y="644">group_view.py</text>

  <!-- edges -->
  <path class="flow-solid" d="M336 88 L376 88" marker-end="url(#dep)"/>
  <text class="t-arrow" x="338" y="80">register</text>
  <path class="flow-solid" d="M336 218 L360 218 L360 150 L376 150" marker-end="url(#dep)"/>
  <text class="t-arrow" x="338" y="210">init</text>

  <path class="flow-hot" d="M380 330 L336 330 L336 394" marker-end="url(#dephot)"/>
  <text class="t-arrow hot" x="250" y="322">allocates on save</text>

  <path class="flow-cold" d="M380 348 L200 348 L200 376" marker-end="url(#depcold)"/>
  <text class="t-arrow cold" x="210" y="382">returns</text>

  <path class="flow-grey" d="M800 80 L840 80" marker-end="url(#dep)"/>
  <text class="t-arrow" x="804" y="72">uses</text>
  <path class="flow-grey" d="M1024 192 L1024 172" marker-end="url(#tri)"/>
  <text class="t-arrow" x="1034" y="186">implements</text>

  <path class="flow-solid" d="M520 316 L520 336" marker-start="url(#dia)" marker-end="url(#dep)"/>
  <text class="t-arrow" x="530" y="332">owns</text>
  <path class="flow-solid" d="M720 316 L720 328 L844 328 L844 340" marker-start="url(#dia)" marker-end="url(#dep)"/>
  <text class="t-arrow" x="760" y="322">owns</text>

  <path class="flow-hot" d="M800 430 L840 430" marker-end="url(#dephot)"/>
  <text class="t-arrow hot" x="804" y="422">scatter (bg)</text>
  <path class="flow-cold" d="M800 490 L840 490" marker-end="url(#depcold)"/>
  <text class="t-arrow cold" x="804" y="512">committed read</text>

  <path class="flow-hot" d="M380 470 L336 470" marker-end="url(#dephot)"/>
  <text class="t-arrow hot" x="250" y="462">submit / join</text>
  <path class="flow-cold" d="M380 510 L336 510" marker-end="url(#depcold)"/>
  <text class="t-arrow cold" x="248" y="548">fetch_host if in-transit</text>

  <text class="t-small" x="36" y="760">Solid diamond = composition. Amber = write/create. Dashed blue = read. Dashed grey = protocol. Manager is the only (slot, key) state authority; Controller reports completion.</text>
</svg>
