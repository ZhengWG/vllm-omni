<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1140">
  <style>
    text{font-family:ui-monospace,'SF Mono',Consolas,Menlo,monospace;fill:#1B2530;}
    .t-eyebrow{font-size:10.5px;fill:#5D6B79;letter-spacing:.08em;}
    .t-label{font-size:12px;}
    .t-small{font-size:10.8px;fill:#5D6B79;}
    .numtxt{font-size:10.5px;font-weight:700;fill:#F2F4F6;}
    .lane{stroke:#CFD7DE;stroke-width:1;stroke-dasharray:2 4;}
    .lifebox{fill:#FBFCFD;stroke:#CFD7DE;stroke-width:1.25;}
    .act-hot{fill:rgba(180,103,31,.10);stroke:#B4671F;stroke-width:1;}
    .act-blue{fill:rgba(62,110,150,.10);stroke:#3E6E96;stroke-width:1;}
    .par{fill:rgba(62,110,150,.07);stroke:#3E6E96;stroke-width:1;stroke-dasharray:6 4;}
    .msg{stroke:#1B2530;stroke-width:1.3;fill:none;}
    .msg-r{stroke:#5D6B79;stroke-width:1.2;stroke-dasharray:5 4;fill:none;}
    .selfbox{fill:#EDF0F2;stroke:#CFD7DE;stroke-width:1;}
    .phase{stroke:#5D6B79;stroke-width:1;stroke-dasharray:3 5;}
    .numdot{fill:#B4671F;}
    .bold{font-weight:600;}
    .note{fill:#FBFCFD;stroke:#CFD7DE;stroke-width:1;}
  </style>
  <defs>
    <marker id="am" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#1B2530"/></marker>
    <marker id="amr" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#5D6B79"/></marker>
  </defs>
  <rect x="0" y="0" width="1280" height="1140" fill="#F2F4F6"/>

  <!-- lanes -->
  <line class="lane" x1="150" y1="88" x2="150" y2="1020"/>
  <line class="lane" x1="470" y1="88" x2="470" y2="1020"/>
  <line class="lane" x1="800" y1="88" x2="800" y2="1020"/>
  <line class="lane" x1="1080" y1="88" x2="1080" y2="1020"/>

  <rect class="lifebox" x="70" y="22" width="160" height="48" rx="7"/>
  <text class="t-label bold" x="150" y="42" text-anchor="middle">Runner</text>
  <text class="t-small" x="150" y="58" text-anchor="middle">execute_model / sample</text>

  <rect class="lifebox" x="350" y="22" width="240" height="48" rx="7"/>
  <text class="t-label bold" x="470" y="42" text-anchor="middle">OmniPrefixCacheManager</text>
  <text class="t-small" x="470" y="58" text-anchor="middle">tables · step ctx · merge</text>

  <rect class="lifebox" x="680" y="22" width="240" height="48" rx="7"/>
  <text class="t-label bold" x="800" y="42" text-anchor="middle">OmniPrefixCacheController</text>
  <text class="t-small" x="800" y="58" text-anchor="middle">copy + scatter thread</text>

  <rect class="lifebox" x="990" y="22" width="180" height="48" rx="7"/>
  <text class="t-label bold" x="1080" y="42" text-anchor="middle">PrefixBlockPool</text>
  <text class="t-small" x="1080" y="58" text-anchor="middle">pinned mirror</text>

  <!-- scenario: wrapped so it stays inside the 1280 canvas -->
  <rect class="note" x="36" y="78" width="1208" height="70" rx="5"/>
  <text class="t-small" x="50" y="96">Example batch at step N. P = running decode (previous JOIN_NEXT_STEP e1 still in-transit;</text>
  <text class="t-small" x="50" y="112">deferred codes staged). Q = new request, prefix hit on P's earlier 32 tokens (already committed).</text>
  <text class="t-small" x="50" y="128">Forward computes P's 1 new token + Q's suffix only. materialize uses ctx[N], never live InputBatch.</text>

  <!-- EXECUTE_MODEL -->
  <line class="phase" x1="36" y1="166" x2="1244" y2="166"/>
  <text class="t-eyebrow" x="36" y="160">EXECUTE_MODEL</text>
  <rect class="act-hot" x="142" y="176" width="16" height="520" rx="3"/>

  <path class="msg" d="M158 192 L466 192" marker-end="url(#am)"/>
  <circle class="numdot" cx="176" cy="192" r="9"/><text class="numtxt" x="176" y="196" text-anchor="middle">1</text>
  <text class="t-label" x="194" y="184">new_step_starts(scheduler_output)</text>
  <text class="t-small" x="194" y="214">before _update_states</text>

  <rect class="selfbox" x="486" y="204" width="300" height="70" rx="5"/>
  <text class="t-small" x="498" y="222">drain_completed → apply: still-owned → committed</text>
  <text class="t-small" x="498" y="240">Q is new, num_computed=32 → hit span [0,32)</text>
  <text class="t-small" x="498" y="258">P already live → no rematch (P0 skip)</text>

  <rect class="selfbox" x="70" y="288" width="200" height="50" rx="5"/>
  <text class="t-label" x="82" y="308">_update_states</text>
  <text class="t-small" x="82" y="326">prepare → forward</text>

  <rect class="note" x="290" y="288" width="430" height="50" rx="5"/>
  <text class="t-small" x="302" y="308">P: decode token 33. Q: compute tokens 32.. (KV skips 0..31).</text>
  <text class="t-small" x="302" y="326">This-step hidden rows are only the newly computed tokens.</text>

  <path class="msg" d="M158 364 L466 364" marker-end="url(#am)"/>
  <circle class="numdot" cx="176" cy="364" r="9"/><text class="numtxt" x="176" y="368" text-anchor="middle">2</text>
  <text class="t-label" x="194" y="356">save_outputs(hidden, mm, n, n_pad) → sid=N</text>

  <rect class="selfbox" x="486" y="380" width="300" height="36" rx="5"/>
  <text class="t-small" x="498" y="402">lock: plan join {e1}   then unlock</text>

  <path class="msg" d="M486 438 L796 438" marker-end="url(#am)"/>
  <text class="t-label" x="500" y="430">join(e1)  previous JOIN_NEXT_STEP, off lock</text>

  <rect class="selfbox" x="816" y="426" width="200" height="36" rx="5"/>
  <text class="t-small" x="828" y="448">wait host_event + scatter e1</text>

  <path class="msg" d="M800 482 L1076 482" marker-end="url(#am)"/>
  <text class="t-small" x="820" y="474">scatter e1 hidden → mirror</text>
  <path class="msg-r" d="M1076 504 L800 504" marker-end="url(#amr)"/>
  <text class="t-small" x="820" y="524">e1 done</text>

  <path class="msg-r" d="M796 546 L486 546" marker-end="url(#amr)"/>
  <text class="t-small" x="520" y="538">join returns</text>

  <rect class="selfbox" x="486" y="562" width="300" height="88" rx="5"/>
  <text class="t-small" x="498" y="580">lock: drain e1 → committed, owner=0</text>
  <text class="t-small" x="498" y="598">D2D freeze this-step hidden (P+Q rows)</text>
  <text class="t-small" x="498" y="616">alloc e2 JOIN_NEXT_STEP; slots in-transit</text>
  <text class="t-small" x="498" y="634">stage P codes JOIN_ON_FINISH eP (not queued)</text>

  <path class="msg" d="M486 666 L796 666" marker-end="url(#am)"/>
  <text class="t-label" x="500" y="658">submit(e2)  queued JOIN_NEXT_STEP</text>

  <path class="msg-r" d="M466 698 L158 698" marker-end="url(#amr)"/>
  <text class="t-label" x="194" y="690">sid=N  ctx[N] = slots + owners + Q hit</text>

  <!-- controller parallel -->
  <rect class="par" x="690" y="714" width="540" height="70" rx="8"/>
  <text class="t-eyebrow" x="704" y="734">CONTROLLER (overlaps next forward / sample)</text>
  <text class="t-small" x="704" y="754">wait host_event · H2H-scatter e2 from staging views</text>
  <text class="t-small" x="704" y="772">report complete; Manager applies on next drain (not on this read)</text>

  <!-- SAMPLE -->
  <line class="phase" x1="36" y1="802" x2="1244" y2="802"/>
  <text class="t-eyebrow" x="36" y="796">SAMPLE_TOKENS / OUTPUT BUILD</text>
  <rect class="act-hot" x="142" y="812" width="16" height="70" rx="3"/>

  <rect class="selfbox" x="70" y="818" width="200" height="36" rx="5"/>
  <text class="t-label" x="82" y="840">sample → token ids</text>

  <text class="t-small" x="70" y="872">no cache calls in sampling</text>

  <path class="msg" d="M158 896 L466 896" marker-end="url(#am)"/>
  <circle class="numdot" cx="176" cy="896" r="9"/><text class="numtxt" x="176" y="900" text-anchor="middle">3</text>
  <text class="t-label" x="194" y="888">materialize(N, [P, Q])</text>
  <text class="t-small" x="194" y="918">or discard_step(N) if no consumer</text>

  <rect class="act-blue" x="462" y="884" width="16" height="110" rx="3"/>

  <rect class="selfbox" x="486" y="912" width="300" height="88" rx="5"/>
  <text class="t-small" x="498" y="930">lock: take ctx[N], drain, plan by owner</text>
  <text class="t-small" x="498" y="948">P miss → this-step freeze slice only</text>
  <text class="t-small" x="498" y="966">Q hit [0,32): committed → pool.rows</text>
  <text class="t-small" x="498" y="984">Q suffix + any in-transit → fetch_host(e2)</text>

  <path class="msg" d="M786 950 L1076 950" marker-end="url(#am)"/>
  <text class="t-small" x="800" y="942">rows(hidden, Q prefix slots)</text>
  <path class="msg" d="M786 982 L796 982" marker-end="url(#am)"/>
  <text class="t-small" x="690" y="1006">fetch_host(e2) if still in-transit</text>

  <path class="msg-r" d="M466 1030 L158 1030" marker-end="url(#amr)"/>
  <text class="t-label" x="194" y="1022">StageCacheOutputs: P=slice · Q=cache[0,32)+suffix</text>

  <text class="t-small" x="36" y="1070">Lock never covers join / D2H / cap flush. Hit-span absent → dump + process exit.</text>
  <text class="t-small" x="36" y="1086">Same-step hit on e2 (another request while e2 is in-transit) uses fetch_host, not the mirror.</text>
  <text class="t-small" x="36" y="1102">Abort of P still takes path 2 (hash already in this batch). Preemption skip/escalate is not shown.</text>
</svg>
