# Qwen3-Omni-MoE GPU-direct deploy (Experimental).
#
# Same topology as qwen3_omni_moe.yaml, with one difference: everything the
# talker consumes on GPU (prefill embeddings + hidden states — tens of MB on
# the first-audio-packet path — and the per-token decode embeddings) rides
# TorchIpcConnector's device-to-device plane instead of
# serialize + D2H + /dev/shm + H2D.  The plane is handle-based and runs on
# dedicated streams at both ends, so per-token packets pay no host
# synchronization and no compute-stream coupling.
#
# gpu_tensor_keys is a consumer-locality contract, not a tuning knob: list
# the payload keys the downstream stage consumes on GPU.  That is why the
# talker -> code2wav edge stays on SharedMemoryConnector — its payload is
# codec codes consumed as CPU token ids in prompt construction; a GPU plane
# would only add a synchronous .cpu() on the receive thread.
#
# Requirements:
#   * Both edge endpoints on the same host, worker in-process (TP=1 stages).
#   * Stage devices either coincide (stages 1/2 share cuda:1 here) or have
#     peer access (NVLink / PCIe P2P) between them for the 0 -> 1 edge.
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0,1 vllm serve <model> --omni \
#       --deploy-config vllm_omni/deploy/qwen3_omni_moe_torch_ipc.yaml
async_chunk: true

connectors:
  # Thinker -> talker edge: embeddings and hidden states are consumed on GPU
  # by the talker, so the whole "embed" root (prefill, decode, tts_*) and
  # "hidden_states" ride the D2D plane.  This spec also serves as stage 1's
  # connector (a stage resolves one connector from its edges), so the codec
  # streaming params the talker's send pipeline reads live here as well —
  # they are stage-input parameters, not transport knobs.  TorchIpc payloads
  # without CUDA tensors are plain shared-memory payloads, so the talker ->
  # code2wav hop through this connector is wire-identical to SHM.
  connector_of_torch_ipc:
    name: TorchIpcConnector
    extra:
      gpu_tensor_keys: ["embed", "hidden_states"]
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25
  # Codec stream edge (talker -> code2wav): codes are CPU-consumed token
  # ids — SHM is the correct transport here, not a fallback.
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25

stages:
  - stage_id: 0
    max_num_batched_tokens: 32768
    max_num_seqs: 64
    gpu_memory_utilization: 0.9
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048

  - stage_id: 1
    max_num_batched_tokens: 32768
    max_num_seqs: 64
    gpu_memory_utilization: 0.6
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "1"
    input_connectors:
      from_stage_0: connector_of_torch_ipc
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      repetition_penalty: 1.05

  - stage_id: 2
    max_num_batched_tokens: 65536
    max_num_seqs: 64
    gpu_memory_utilization: 0.1
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    devices: "1"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.1

platforms:
  # See qwen3_omni_moe.yaml: keep MRoPE on the CUDA path.
  cuda:
    stages:
      - stage_id: 0
        compilation_config:
          custom_ops: ["+rotary_embedding"]
