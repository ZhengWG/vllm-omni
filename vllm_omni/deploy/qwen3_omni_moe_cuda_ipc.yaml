# Qwen3-Omni-MoE — CudaIPCConnector (one stage per GPU, all cross-GPU CudaIPC).
#
# The connector routes put()/get() through the per-edge SPSC mailbox (CudaIpcControlRing)
# instead of a per-transfer /dev/shm round-trip. Small payloads (< inline_threshold_bytes)
# ride inline in the ring; big ones use the pool + D2D (descriptor in the ring); overflow /
# ring-full / abort fall back to /dev/shm (read via _try_get_shm_compat).
#
# Memory: the GPU pool (pool_size_mb) is OUTSIDE gpu_memory_utilization, so real usage ~= gmu + pool.
# /dev/shm: rings need ~ring_entries * ring_body_max host shm (~1GB s0->s1 + ~256MB s1->s2); raise the 64MB
# container default (e.g. `docker run --shm-size=4g`) or CudaIpcControlRing.create fails with OSError.
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0,1,2 vllm serve <model> --omni \
#       --deploy-config vllm_omni/deploy/qwen3_omni_moe_cuda_ipc.yaml
#
async_chunk: true

connectors:
  # Prefill handoff edge (thinker -> talker): ~33MB/req payloads -> big slots.
  # Shared knobs are anchored here; the stream edge below only overrides pool
  # sizing — capacity is a per-edge property (like per-stage gmu), so the two
  # definitions deliberately stay separate.
  connector_of_cuda_ipc:
    name: CudaIPCConnector
    extra: &cuda_ipc_extra
      tensor_lifetime_sec: 30.0
      pool_size_mb: 4096
      pool_credits: 64               # slot = 4096/64 = 64MB
      small_slot_kb: 256             # decode-step small payloads
      small_slot_count: 128          # +32MB
      inline_threshold_bytes: 16384  # < 16KB -> inline
      ring_body_max: 524288
      ring_entries: 2048
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25
  # Codec stream edge (talker -> code2wav): many small chunks -> the small-slot
  # pool carries the traffic; a few big slots absorb oversize outliers.
  # Ring: 512 x 512KB ~ 256MB host shm for this edge.
  connector_of_cuda_ipc_stream:
    name: CudaIPCConnector
    extra:
      <<: *cuda_ipc_extra
      # L2 tiered placement: tensors >= keep_on_gpu_min_bytes ride the GPU
      # pool D2D (on the co-located-stage topology this is an HBM-internal
      # copy, zero PCIe); smaller/control tensors drop to CPU and ride the
      # ring inline — avoids the per-step GPU-clone/tiny-tensor-sync tax that
      # full keep_on_gpu was measured to add (uniform TTFT/TTFP inflation).
      # L1 fallback if L2 regresses: set keep_on_gpu: false (and the pool
      # can then be shrunk — CPU payloads never touch it).
      keep_on_gpu: true
      # STABLE per-key placement (L2 v2): listed key roots stay on GPU for
      # EVERY chunk; everything else drops to CPU. Never size-tier streamed
      # tensors — per-instance thresholds flap the device across chunks and
      # break downstream torch.cat (measured: dropped chunks, -25% audio).
      keep_on_gpu_keys: ["hidden_states"]
      # Experimental ladder knobs (A/B one at a time, default off):
      #   pack_at_snapshot: true   # L3 — producer packs into the slot at snapshot
      #                            #      (runner integration pending; connector ready)
      #   zero_copy_recv: true     # L4 — receiver consumes slots as DLPack views,
      #                            #      slot released at request cleanup + TTL
      pool_size_mb: 512
      pool_credits: 8                # slot = 64MB (outliers)
      small_slot_count: 256          # +64MB; big-enough chunk tensors live here
      ring_entries: 512
  # Kept for A/B triage: flip the two *_stream edge refs below to this to
  # compare the codec edge over host SHM vs D2D.
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25

stages:
  - stage_id: 0
    max_num_batched_tokens: 32768
    max_num_seqs: 64
    gpu_memory_utilization: 0.9
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048

  - stage_id: 1
    max_num_batched_tokens: 32768
    max_num_seqs: 64
    gpu_memory_utilization: 0.6
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "1"
    input_connectors:
      from_stage_0: connector_of_cuda_ipc          # prefill handoff: D2D
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2
    max_num_batched_tokens: 65536
    max_num_seqs: 64
    gpu_memory_utilization: 0.5
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    devices: "2"
    input_connectors:
      from_stage_1: connector_of_cuda_ipc_stream   # codec stream: ring transport
      # NOTE: each edge is declared ONCE, on its receiving stage — the sender's
      # output connector is derived from the same edge spec (original schema).
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.1
