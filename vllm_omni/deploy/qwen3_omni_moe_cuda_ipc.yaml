# Qwen3-Omni-MoE — CudaIPCConnector (same-host cross-GPU D2D on every edge).
#
# All transport knobs are defaulted or derived; the only capacity decision
# left to the user is the per-edge GPU pool budget (pool_size_mb, allocated
# OUTSIDE gpu_memory_utilization — real usage ~= gmu + pool). Payloads that
# exceed a pool slot or a full ring degrade to the /dev/shm CPU fallback
# instead of failing. The expert-tuning surface (max_transfer_mb, ring_*,
# small_slot_*, inline_threshold_bytes, ...) is documented in
# docs/configuration/stage_configs.md.
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0,1 vllm serve <model> --omni \
#       --deploy-config vllm_omni/deploy/qwen3_omni_moe_cuda_ipc.yaml
#
async_chunk: true

connectors:
  # Prefill handoff edge (thinker -> talker): defaults fit chat-sized
  # prompts (4GB pool, 128MB max single transfer ~= 14k-token handoff).
  connector_of_cuda_ipc:
    name: CudaIPCConnector
    extra:
      # Codec streaming params (stage-input pipeline, not transport knobs).
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25
  # Codec stream edge (talker -> code2wav): many small chunks ride the
  # small-slot pool; hidden_states stays on GPU every chunk
  connector_of_cuda_ipc_stream:
    name: CudaIPCConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25
      keep_on_gpu_keys: ["hidden_states"]
      pool_size_mb: 512

stages:
  - stage_id: 0
    max_num_batched_tokens: 32768
    max_num_seqs: 64
    gpu_memory_utilization: 0.9
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048

  - stage_id: 1
    max_num_batched_tokens: 32768
    max_num_seqs: 64
    gpu_memory_utilization: 0.6
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "1"
    input_connectors:
      from_stage_0: connector_of_cuda_ipc          # prefill handoff: D2D
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2
    max_num_batched_tokens: 65536
    max_num_seqs: 64
    gpu_memory_utilization: 0.1
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    devices: "1"
    input_connectors:
      from_stage_1: connector_of_cuda_ipc_stream   # codec stream: ring transport
      # NOTE: each edge is declared ONCE, on its receiving stage — the sender's
      # output connector is derived from the same edge spec (original schema).
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.1
