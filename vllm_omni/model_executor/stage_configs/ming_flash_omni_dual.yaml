# Dual-stage single-node deployment of Ming-flash-omni-2.0 text-to-image.
#
# Stage 0 (thinker):  BailingMoeV2 LLM + vision/audio encoders. TP=2 on cards 0,1.
#                     Detects text-to-image requests (<imagePatch> tokens in
#                     the prompt, no vision input), replaces those positions
#                     with learnable query_tokens_dict embeddings, runs forward,
#                     and exports the final-layer hidden states at query-token
#                     positions under multimodal_outputs["ming_imagegen_hidden_states"].
#
# Stage 1 (imagegen): Qwen2 connector + ZImage DiT + VAE. TP=1 on card 3.
#                     Consumes the hidden-state tensor shipped from stage 0 as
#                     cross-stage payload, runs condition encoder + diffusion
#                     main loop + VAE decode, emits a PIL image.
#
# Cross-stage transport: ``shared_memory_connector`` (intra-node, tensor payload).
# A ``custom_process_input_func`` (``ming_flash_omni.thinker2imagegen``) bridges
# the two stages by extracting the right tensor from stage 0's output and
# packaging it into ``OmniTokensPrompt.additional_information`` for stage 1.
#
# Phase 2 v0 still requires the user to include ``<image><imagePatch>*256</image>``
# explicitly in the prompt text — automatic prompt expansion is Phase 2 v1.

stage_args:
  - stage_id: 0
    stage_type: llm
    runtime:
      devices: "0,1"
    engine_args:
      model_stage: thinker
      max_num_seqs: 1
      model_arch: MingFlashOmniForConditionalGeneration
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      gpu_memory_utilization: 0.85
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: latent
      distributed_executor_backend: "mp"
      enable_prefix_caching: false
      hf_config_name: thinker_config
      tensor_parallel_size: 2
    is_comprehension: true
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 1  # image-gen request: prefill only, no AR decode
      seed: 42
      detokenize: false
    output_connectors:
      to_stage_1: shared_memory_connector

  - stage_id: 1
    stage_type: llm
    runtime:
      devices: "3"
    engine_args:
      model_stage: imagegen
      max_num_seqs: 1
      model_arch: MingFlashOmniForConditionalGeneration
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      gpu_memory_utilization: 0.9
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: image
      distributed_executor_backend: "mp"
      enable_prefix_caching: false
      hf_config_name: thinker_config
      tensor_parallel_size: 1
    engine_input_source: [0]
    custom_process_input_func: vllm_omni.model_executor.stage_input_processors.ming_flash_omni.thinker2imagegen
    final_output: true
    final_output_type: image
    is_comprehension: false
    default_sampling_params:
      # imagegen stage does not produce tokens — it outputs a PIL image via
      # multimodal_outputs. Run the vllm sampler on the dummy logits returned
      # by our compute_logits (shape [num_reqs, 128]) but disable top-k/top-p
      # to minimize warmup cost.
      temperature: 1.0
      top_k: -1
      top_p: 1.0
      max_tokens: 1
      seed: 42
      detokenize: false
    input_connectors:
      from_stage_0: shared_memory_connector

runtime:
  enabled: true
  defaults:
    window_size: -1
    max_inflight: 1

  connectors:
    shared_memory_connector:
      name: SharedMemoryConnector
      extra:
        shm_threshold_bytes: 65536  # 64KB threshold

  edges:
    - from: 0
      to: 1
      window_size: -1
