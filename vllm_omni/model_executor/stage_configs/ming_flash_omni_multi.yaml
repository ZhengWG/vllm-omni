# Ming-flash-omni-2.0 — multi-stage text-to-image deployment.
#
# Stage 0: Thinker (BailingMoeV2 LLM + vision/audio encoders). Produces the
#          final-layer hidden states at learnable query-token positions and
#          forwards them to Stage 1 via the transfer protocol.
# Stage 1: ImageGen (Qwen2 connector + ZImage DiT + VAE). Consumes those
#          hidden states as diffusion conditions and decodes a PIL image.
#
# Phase 1 (this config):
#   - dit_type=zimage, single img_gen_scale=[16] (256 query tokens)
#   - ByT5 text enhancement: disabled
#   - CFG: zero-embedding negative condition
#   - Fixed resolution 1024x1024
#
# Modeled after bagel_multiconnector.yaml. Cross-stage transport re-uses the
# same mooncake_connector but carries a hidden-state tensor payload instead of
# a full KV cache — see stage_input_processors/ming_flash_omni.py.

stage_args:
  - stage_id: 0
    stage_type: llm
    runtime:
      devices: "0"
    engine_args:
      model_stage: thinker
      max_num_seqs: 1
      model_arch: MingFlashOmniForConditionalGeneration
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      gpu_memory_utilization: 0.55
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: text
      distributed_executor_backend: "mp"
      enable_prefix_caching: false
      max_num_batched_tokens: 32768
      tensor_parallel_size: 1
      omni_kv_config:
        need_send_cache: true
        kv_transfer_criteria:
          type: prefill_finished
    final_output: true
    final_output_type: text
    is_comprehension: true
    default_sampling_params:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 1024
      seed: 52
      detokenize: true
    output_connectors:
      to_stage_1: mooncake_connector

  - stage_id: 1
    stage_type: diffusion
    runtime:
      devices: "0"
    engine_args:
      model_stage: imagegen
      max_num_seqs: 1
      model_arch: MingFlashOmniForConditionalGeneration
      enforce_eager: true
      trust_remote_code: true
      distributed_executor_backend: "mp"
      omni_kv_config:
        need_recv_cache: true
    engine_input_source: [0]

    final_output: true
    final_output_type: image
    is_comprehension: false
    default_sampling_params:
      seed: 52
    input_connectors:
      from_stage_0: mooncake_connector

runtime:
  enabled: true
  defaults:
    window_size: -1
    max_inflight: 1

  connectors:
    mooncake_connector:
      name: MooncakeStoreConnector
      extra:
        host: "127.0.0.1"
        metadata_server: "http://10.90.67.86:8080/metadata"
        master: "10.90.67.86:50051"
        segment: 512000000
        localbuf: 64000000
        proto: "tcp"

  edges:
    - from: 0
      to: 1
      window_size: -1
